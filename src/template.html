<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
</head>
<body>
  <!-- Header with logo -->
  <header>
    <img id="logo" alt="Battleship Logo">
  </header>

  <!-- Introduction Overlay -->
  <div id="intro-screen">
    <!-- Pirate Scroll Background -->
    <img id="scroll-bg" alt="Pirate Scroll">

    <!-- Overlay content on top of scroll -->
    <div id="intro-content">
      <label for="player-name">CAPTAIN NAME:</label>
      <input type="text" id="player-name" placeholder="ENTER NAME">
      
      <!-- Start Game Button -->
      <button id="start-btn" aria-label="Start Game"></button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="hidden">
    <div id="players">
      <div class="player">
        <img id="player1-img" alt="Player 1">
        <div id="player1-board" class="gameboard"></div>
      </div>
      <div class="player">
        <img id="player2-img" alt="Player 2">
        <div id="player2-board" class="gameboard"></div>
      </div>
    </div>
    <audio id="battle-music" loop></audio>
  </div>

  <!-- Hit/Miss sounds -->
  <audio id="hit-sound"></audio>
  <audio id="miss-sound"></audio>
</body>
</html>
